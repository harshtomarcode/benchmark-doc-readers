# Dry-run config using the built-in mock provider (no API key needed).
# Usage:
#   docbench run -c configs/example_mock.yaml

model:
  type: mock
  id: mock-doc-reader
  options:
    latency_ms: 20
    default_answer: "Mock answer"
    # Optionally pin answers for specific prompts/images:
    # answers:
    #   "fruit_table.png": "210"

qualitative:
  enabled: true
  tasks:
    text_reading:
      enabled: true
      dataset: datasets/text
      metrics: [exact_match, contains, token_f1]
    table_reading:
      enabled: true
      dataset: datasets/tables
      metrics: [exact_match, contains, token_f1, numeric_tolerance]
    chart_reading:
      enabled: true
      dataset: datasets/charts
      metrics: [exact_match, contains, token_f1]
    infographic:
      enabled: true
      dataset: datasets/infographics
      metrics: [exact_match, contains, token_f1]
    ocr:
      enabled: true
      dataset: datasets/ocr
      metrics: [exact_match, contains, token_f1]

stress:
  enabled: true
  workloads:
    pure_text:
      enabled: true
      modality: text
      dataset: datasets/text
      warmup: 1
      iterations: 5
      concurrency_levels: [1, 4]
      requests_per_level: 8
    image_to_text:
      enabled: true
      modality: image
      dataset: datasets/charts
      warmup: 1
      iterations: 5
      concurrency_levels: [1, 4]
      requests_per_level: 8

output:
  dir: results
  formats: [json, markdown]
  run_name: mock_smoke

seed: 42