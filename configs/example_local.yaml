# Local Hugging Face / Transformers model.
# Requires: pip install -e ".[local]"
#
# Usage:
#   docbench run -c configs/example_local.yaml

model:
  type: local
  id: Qwen/Qwen2-VL-2B-Instruct   # example VLM; swap for your checkpoint
  device: auto
  torch_dtype: auto
  trust_remote_code: true
  max_new_tokens: 512

qualitative:
  enabled: true
  tasks:
    text_reading:
      enabled: true
      dataset: datasets/text
      metrics: [exact_match, contains, token_f1]
    table_reading:
      enabled: true
      dataset: datasets/tables
      metrics: [exact_match, contains, token_f1]
    chart_reading:
      enabled: true
      dataset: datasets/charts
      metrics: [exact_match, contains, token_f1]
    infographic:
      enabled: true
      dataset: datasets/infographics
      metrics: [exact_match, contains, token_f1]
    ocr:
      enabled: true
      dataset: datasets/ocr
      metrics: [exact_match, contains, token_f1]

stress:
  enabled: true
  workloads:
    pure_text:
      enabled: true
      modality: text
      dataset: datasets/text
      warmup: 1
      iterations: 10
      concurrency_levels: [1, 2]
      requests_per_level: 8
    image_to_text:
      enabled: true
      modality: image
      dataset: datasets/ocr
      warmup: 1
      iterations: 10
      concurrency_levels: [1, 2]
      requests_per_level: 8

output:
  dir: results
  formats: [json, markdown]

seed: 42