[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docbench"
version = "0.1.0"
description = "Benchmark suite for document reading capabilities (qualitative + stress)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Harsh Tomar" }]
keywords = ["benchmark", "document-ai", "ocr", "vlm", "llm"]
dependencies = [
  "pyyaml>=6.0",
  "httpx>=0.27",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "rich>=13.0",
  "jinja2>=3.1",
  "numpy>=1.26",
  "Pillow>=10.0",
  "tenacity>=8.2",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
omni = [
  "omni-extract-bench==0.1.2",
  "polars>=1.0",
  "huggingface-hub>=0.34",
]
local = [
  "transformers>=4.40",
  "torch>=2.1",
  "accelerate>=0.28",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
]

[project.scripts]
docbench = "docbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
